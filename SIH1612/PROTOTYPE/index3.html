<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityTransit - Live Bus Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }
        .mobile-container {
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }
        .bus-marker {
            animation: busMove 2s ease-in-out infinite;
        }
        @keyframes busMove {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }
        .stop-marker {
            animation: stopPulse 3s ease-in-out infinite;
        }
        @keyframes stopPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        .arrival-card {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .map-container {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
            position: relative;
            overflow: hidden;
        }
        .route-line {
            stroke-dasharray: 5,5;
            animation: routeFlow 2s linear infinite;
        }
        @keyframes routeFlow {
            to { stroke-dashoffset: -10; }
        }
        .notification-badge {
            animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="mobile-container bg-white shadow-2xl">
        <!-- Status Bar -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 text-sm flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                <span>Live Tracking</span>
            </div>
            <div id="currentTime" class="font-mono"></div>
        </div>

        <!-- Header -->
        <div class="bg-white px-4 py-4 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">🚌 CityTransit</h1>
                    <p class="text-sm text-gray-600">Live Bus Tracker</p>
                </div>
                <div class="relative">
                    <button class="p-2 bg-blue-100 rounded-full" onclick="toggleNotifications()">
                        🔔
                        <span class="notification-badge absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Route Selection -->
        <div class="px-4 py-3 bg-gray-50 border-b border-gray-200">
            <div class="flex items-center space-x-2 mb-3">
                <span class="text-sm font-medium text-gray-700">Select Route:</span>
                <select id="routeSelect" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm" onchange="filterByRoute()">
                    <option value="">All Routes</option>
                    <option value="501">Route 501 - Downtown</option>
                    <option value="234B">Route 234B - Airport</option>
                    <option value="88">Route 88 - Shopping</option>
                    <option value="156">Route 156 - Medical</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-sm font-medium text-gray-700">My Stop:</span>
                <select id="stopSelect" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm" onchange="selectStop()">
                    <option value="">Choose your stop</option>
                    <option value="central">Central Station</option>
                    <option value="university">University Gate</option>
                    <option value="mall">Shopping Mall</option>
                    <option value="airport">Airport Terminal</option>
                    <option value="hospital">Medical Center</option>
                </select>
            </div>
        </div>

        <!-- Live Map -->
        <div class="map-container h-64 relative">
            <svg class="w-full h-full" viewBox="0 0 375 256">
                <!-- Route Lines -->
                <path class="route-line" d="M50,50 Q150,100 300,80 Q350,120 320,200" stroke="#fbbf24" stroke-width="3" fill="none"/>
                <path class="route-line" d="M30,200 Q100,150 200,160 Q280,140 350,100" stroke="#10b981" stroke-width="3" fill="none"/>
                
                <!-- Bus Stops -->
                <g class="stop-marker">
                    <circle cx="80" cy="70" r="8" fill="#ef4444" stroke="white" stroke-width="2"/>
                    <text x="80" y="90" text-anchor="middle" class="text-xs fill-white">Central</text>
                </g>
                <g class="stop-marker">
                    <circle cx="180" cy="120" r="8" fill="#ef4444" stroke="white" stroke-width="2"/>
                    <text x="180" y="140" text-anchor="middle" class="text-xs fill-white">University</text>
                </g>
                <g class="stop-marker">
                    <circle cx="280" cy="90" r="8" fill="#ef4444" stroke="white" stroke-width="2"/>
                    <text x="280" y="110" text-anchor="middle" class="text-xs fill-white">Mall</text>
                </g>
                <g class="stop-marker">
                    <circle cx="320" cy="180" r="8" fill="#ef4444" stroke="white" stroke-width="2"/>
                    <text x="320" y="200" text-anchor="middle" class="text-xs fill-white">Airport</text>
                </g>
                
                <!-- Live Buses -->
                <g id="busMarkers">
                    <!-- Buses will be dynamically positioned -->
                </g>
            </svg>
            
            <!-- Map Legend -->
            <div class="absolute top-2 right-2 bg-black/70 text-white p-2 rounded text-xs">
                <div class="flex items-center space-x-1 mb-1">
                    <div class="w-3 h-3 bg-yellow-400 rounded"></div>
                    <span>Route 501</span>
                </div>
                <div class="flex items-center space-x-1">
                    <div class="w-3 h-3 bg-green-400 rounded"></div>
                    <span>Route 234B</span>
                </div>
            </div>
        </div>

        <!-- Selected Stop Info -->
        <div id="stopInfo" class="px-4 py-3 bg-blue-50 border-b border-blue-200 hidden">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-semibold text-blue-800">📍 <span id="selectedStopName">Central Station</span></h3>
                    <p class="text-sm text-blue-600">Next arrivals at your stop</p>
                </div>
                <button onclick="clearStop()" class="text-blue-600 hover:text-blue-800">✕</button>
            </div>
        </div>

        <!-- Live Arrivals -->
        <div class="flex-1 overflow-y-auto">
            <div class="px-4 py-3 border-b border-gray-200">
                <h2 class="font-semibold text-gray-800 flex items-center">
                    🕐 Live Arrivals
                    <span class="ml-2 text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">Updated now</span>
                </h2>
            </div>
            
            <div id="arrivalsContainer" class="divide-y divide-gray-100">
                <!-- Arrivals will be populated by JavaScript -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bg-white border-t border-gray-200 px-4 py-2">
            <div class="flex justify-around">
                <button class="flex flex-col items-center py-2 text-blue-600">
                    <span class="text-lg">🗺️</span>
                    <span class="text-xs">Map</span>
                </button>
                <button class="flex flex-col items-center py-2 text-gray-400" onclick="showFavorites()">
                    <span class="text-lg">⭐</span>
                    <span class="text-xs">Favorites</span>
                </button>
                <button class="flex flex-col items-center py-2 text-gray-400" onclick="showAlerts()">
                    <span class="text-lg">🚨</span>
                    <span class="text-xs">Alerts</span>
                </button>
                <button class="flex flex-col items-center py-2 text-gray-400" onclick="showSettings()">
                    <span class="text-lg">⚙️</span>
                    <span class="text-xs">Settings</span>
                </button>
            </div>
        </div>

        <!-- Notification Panel -->
        <div id="notificationPanel" class="absolute top-0 left-0 w-full h-full bg-black/50 hidden" onclick="toggleNotifications()">
            <div class="absolute top-16 right-4 bg-white rounded-lg shadow-xl p-4 w-80 max-w-[calc(100%-2rem)]" onclick="event.stopPropagation()">
                <h3 class="font-semibold mb-3">🔔 Notifications</h3>
                <div class="space-y-2 text-sm">
                    <div class="p-2 bg-blue-50 rounded border-l-4 border-blue-400">
                        <div class="font-medium">Route 501 Update</div>
                        <div class="text-gray-600">Your bus arrives in 3 minutes</div>
                    </div>
                    <div class="p-2 bg-orange-50 rounded border-l-4 border-orange-400">
                        <div class="font-medium">Service Alert</div>
                        <div class="text-gray-600">Minor delays on Route 234B</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Live bus data with GPS coordinates
        let busData = [
            {
                id: "bus_501_1",
                route: "501",
                destination: "Downtown Terminal",
                currentSpeed: 45,
                gpsLat: 40.7128,
                gpsLng: -74.0060,
                mapX: 120,
                mapY: 80,
                nextStop: "Central Station",
                distanceToStop: 1.2,
                status: "On Time",
                capacity: 28,
                maxCapacity: 40
            },
            {
                id: "bus_234b_1",
                route: "234B",
                destination: "Airport Express",
                currentSpeed: 38,
                gpsLat: 40.7589,
                gpsLng: -73.9851,
                mapX: 200,
                mapY: 140,
                nextStop: "University Gate",
                distanceToStop: 0.8,
                status: "On Time",
                capacity: 15,
                maxCapacity: 40
            },
            {
                id: "bus_501_2",
                route: "501",
                destination: "University Campus",
                currentSpeed: 42,
                gpsLat: 40.6892,
                gpsLng: -74.0445,
                mapX: 250,
                mapY: 100,
                nextStop: "Shopping Mall",
                distanceToStop: 2.1,
                status: "Delayed",
                capacity: 35,
                maxCapacity: 40
            },
            {
                id: "bus_88_1",
                route: "88",
                destination: "Shopping District",
                currentSpeed: 35,
                gpsLat: 40.7505,
                gpsLng: -73.9934,
                mapX: 160,
                mapY: 160,
                nextStop: "Central Station",
                distanceToStop: 0.5,
                status: "Early",
                capacity: 12,
                maxCapacity: 40
            }
        ];

        let selectedRoute = "";
        let selectedStop = "";

        // Calculate arrival time based on distance and speed
        function calculateArrivalTime(distanceKm, speedKmh) {
            if (speedKmh === 0) return "Stopped";
            const timeHours = distanceKm / speedKmh;
            const timeMinutes = Math.round(timeHours * 60);
            return Math.max(1, timeMinutes);
        }

        // Get capacity color
        function getCapacityColor(current, max) {
            const percentage = (current / max) * 100;
            if (percentage < 50) return "text-green-600";
            if (percentage < 80) return "text-yellow-600";
            return "text-red-600";
        }

        // Get status color
        function getStatusColor(status) {
            const colors = {
                "On Time": "text-green-600",
                "Delayed": "text-red-600",
                "Early": "text-blue-600",
                "Stopped": "text-yellow-600"
            };
            return colors[status] || "text-gray-600";
        }

        // Filter buses by selected route
        function filterByRoute() {
            selectedRoute = document.getElementById('routeSelect').value;
            renderArrivals();
            updateBusMarkers();
        }

        // Select stop for arrival predictions
        function selectStop() {
            const stopSelect = document.getElementById('stopSelect');
            selectedStop = stopSelect.value;
            
            if (selectedStop) {
                document.getElementById('stopInfo').classList.remove('hidden');
                document.getElementById('selectedStopName').textContent = stopSelect.options[stopSelect.selectedIndex].text;
            } else {
                document.getElementById('stopInfo').classList.add('hidden');
            }
            
            renderArrivals();
        }

        // Clear selected stop
        function clearStop() {
            selectedStop = "";
            document.getElementById('stopSelect').value = "";
            document.getElementById('stopInfo').classList.add('hidden');
            renderArrivals();
        }

        // Update bus markers on map
        function updateBusMarkers() {
            const container = document.getElementById('busMarkers');
            const filteredBuses = selectedRoute ? 
                busData.filter(bus => bus.route === selectedRoute) : 
                busData;

            container.innerHTML = filteredBuses.map(bus => {
                const routeColor = bus.route === "501" ? "#fbbf24" : 
                                 bus.route === "234B" ? "#10b981" : 
                                 bus.route === "88" ? "#8b5cf6" : "#ef4444";
                
                return `
                    <g class="bus-marker" transform="translate(${bus.mapX}, ${bus.mapY})">
                        <circle r="6" fill="${routeColor}" stroke="white" stroke-width="2"/>
                        <text y="-10" text-anchor="middle" class="text-xs fill-white font-bold">${bus.route}</text>
                        <text y="20" text-anchor="middle" class="text-xs fill-white">${bus.currentSpeed}km/h</text>
                    </g>
                `;
            }).join('');
        }

        // Render arrivals list
        function renderArrivals() {
            const container = document.getElementById('arrivalsContainer');
            let filteredBuses = busData;

            // Filter by route if selected
            if (selectedRoute) {
                filteredBuses = filteredBuses.filter(bus => bus.route === selectedRoute);
            }

            // Filter by stop if selected
            if (selectedStop) {
                const stopNames = {
                    "central": "Central Station",
                    "university": "University Gate", 
                    "mall": "Shopping Mall",
                    "airport": "Airport Terminal",
                    "hospital": "Medical Center"
                };
                filteredBuses = filteredBuses.filter(bus => bus.nextStop === stopNames[selectedStop]);
            }

            // Calculate arrivals and sort
            const processedBuses = filteredBuses.map(bus => ({
                ...bus,
                arrivalMinutes: calculateArrivalTime(bus.distanceToStop, bus.currentSpeed)
            })).sort((a, b) => {
                if (a.arrivalMinutes === "Stopped") return 1;
                if (b.arrivalMinutes === "Stopped") return -1;
                return a.arrivalMinutes - b.arrivalMinutes;
            });

            container.innerHTML = processedBuses.map(bus => {
                const capacityColor = getCapacityColor(bus.capacity, bus.maxCapacity);
                const statusColor = getStatusColor(bus.status);
                const arrivalText = bus.arrivalMinutes === "Stopped" ? "Stopped" : 
                                  bus.arrivalMinutes === 1 ? "1 min" : `${bus.arrivalMinutes} min`;
                
                return `
                    <div class="arrival-card p-4 hover:bg-gray-50">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">
                                    ${bus.route}
                                </div>
                                <div>
                                    <div class="font-semibold text-gray-800">${bus.destination}</div>
                                    <div class="text-sm text-gray-600">Next: ${bus.nextStop}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xl font-bold ${bus.arrivalMinutes <= 2 ? 'text-red-600' : 'text-gray-800'}">${arrivalText}</div>
                                <div class="text-xs ${statusColor}">${bus.status}</div>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center text-sm">
                            <div class="flex items-center space-x-4">
                                <span class="text-gray-600">📍 ${bus.distanceToStop.toFixed(1)} km away</span>
                                <span class="text-gray-600">🚀 ${bus.currentSpeed} km/h</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="${capacityColor}">👥 ${bus.capacity}/${bus.maxCapacity}</span>
                                <button class="text-blue-600 hover:text-blue-800" onclick="trackBus('${bus.id}')">📍</button>
                            </div>
                        </div>
                        
                        <div class="mt-2 text-xs text-gray-500">
                            GPS: ${bus.gpsLat.toFixed(4)}, ${bus.gpsLng.toFixed(4)} • Updated: Just now
                        </div>
                    </div>
                `;
            }).join('');

            if (processedBuses.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-500">
                        <div class="text-4xl mb-2">🚌</div>
                        <div>No buses found</div>
                        <div class="text-sm">Try selecting a different route or stop</div>
                    </div>
                `;
            }
        }

        // Simulate real-time updates
        function updateBusData() {
            busData.forEach(bus => {
                // Simulate movement
                if (bus.currentSpeed > 0) {
                    const movementKm = (bus.currentSpeed / 60) * 0.5; // 30 seconds of movement
                    bus.distanceToStop = Math.max(0, bus.distanceToStop - movementKm);
                    
                    // Update map position
                    bus.mapX += (Math.random() - 0.5) * 10;
                    bus.mapY += (Math.random() - 0.5) * 10;
                    bus.mapX = Math.max(20, Math.min(355, bus.mapX));
                    bus.mapY = Math.max(20, Math.min(236, bus.mapY));
                }
                
                // Simulate speed changes
                const speedChange = (Math.random() - 0.5) * 8;
                bus.currentSpeed = Math.max(0, Math.min(60, bus.currentSpeed + speedChange));
                
                // Reset if arrived
                if (bus.distanceToStop <= 0.1) {
                    bus.distanceToStop = Math.random() * 5 + 1;
                    bus.capacity = Math.floor(Math.random() * 35) + 5;
                }
            });
            
            renderArrivals();
            updateBusMarkers();
        }

        // Update current time
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // Navigation functions
        function toggleNotifications() {
            const panel = document.getElementById('notificationPanel');
            panel.classList.toggle('hidden');
        }

        function trackBus(busId) {
            const bus = busData.find(b => b.id === busId);
            if (bus) {
                alert(`🚌 Tracking Bus ${bus.route}\nCurrent Speed: ${bus.currentSpeed} km/h\nGPS: ${bus.gpsLat.toFixed(4)}, ${bus.gpsLng.toFixed(4)}\nNext Stop: ${bus.nextStop} (${bus.distanceToStop.toFixed(1)} km)`);
            }
        }

        function showFavorites() {
            alert('⭐ Favorites feature coming soon!\nSave your most used routes and stops for quick access.');
        }

        function showAlerts() {
            alert('🚨 Service Alerts\n• Route 234B: Minor delays due to traffic\n• Route 501: Running on schedule\n• Weather: Clear conditions');
        }

        function showSettings() {
            alert('⚙️ Settings\n• Notification preferences\n• Map display options\n• Accessibility settings\n• Account management');
        }

        // Initialize app
        setInterval(updateTime, 1000);
        setInterval(updateBusData, 30000); // Update every 30 seconds
        updateTime();
        renderArrivals();
        updateBusMarkers();

        // Simulate push notifications
        setTimeout(() => {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        new Notification('🚌 CityTransit', {
                            body: 'Your Route 501 bus arrives in 3 minutes!',
                            icon: '🚌'
                        });
                    }
                });
            }
        }, 15000);
    </script>
