<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bus Stop Board - Central Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }
        .arrival-row {
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .live-indicator {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .speed-indicator {
            background: linear-gradient(90deg, #10b981, #3b82f6, #8b5cf6);
            background-size: 200% 100%;
            animation: speedGradient 3s ease-in-out infinite;
        }
        @keyframes speedGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .urgent-arrival {
            animation: urgentBlink 1s ease-in-out infinite;
        }
        @keyframes urgentBlink {
            0%, 100% { background-color: rgba(239, 68, 68, 0.1); }
            50% { background-color: rgba(239, 68, 68, 0.3); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Main Display -->
    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-t-2xl p-6 border-b-4 border-yellow-400">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold">🚏 Central Station</h1>
                    <p class="text-blue-100 mt-1">Live Bus Arrivals</p>
                </div>
                <div class="text-right">
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 bg-green-400 rounded-full live-indicator"></div>
                        <span class="text-sm">LIVE</span>
                    </div>
                    <div class="text-lg font-mono" id="currentTime"></div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="bg-gray-800 px-6 py-3 flex justify-between items-center text-sm">
            <div class="flex items-center space-x-4">
                <span class="text-green-400">● 8 Active Routes</span>
                <span class="text-blue-400">● GPS Tracking</span>
                <span class="text-purple-400">● Real-time Updates</span>
            </div>
            <div class="text-gray-400">
                Last Update: <span id="lastUpdate">Just now</span>
            </div>
        </div>

        <!-- Arrivals Board -->
        <div class="bg-black rounded-b-2xl overflow-hidden">
            <!-- Header Row -->
            <div class="bg-gray-800 px-6 py-4 grid grid-cols-12 gap-4 text-sm font-semibold text-gray-300 border-b border-gray-700">
                <div class="col-span-2">ROUTE</div>
                <div class="col-span-3">DESTINATION</div>
                <div class="col-span-2">ARRIVAL</div>
                <div class="col-span-2">DISTANCE</div>
                <div class="col-span-2">SPEED</div>
                <div class="col-span-1">STATUS</div>
            </div>

            <!-- Live Arrivals -->
            <div id="arrivalsContainer" class="divide-y divide-gray-800">
                <!-- Arrivals will be populated by JavaScript -->
            </div>
        </div>

        <!-- Emergency Alerts -->
        <div id="alertsContainer" class="mt-4"></div>

        <!-- Footer Info -->
        <div class="mt-6 bg-gray-800 rounded-xl p-4 text-center text-sm text-gray-400">
            <p>🌐 Connected to City Transit Network | 📱 Scan QR for mobile updates | ℹ️ Report issues: 311</p>
        </div>
    </div>

    <script>
        // Bus data with real-time GPS and speed simulation
        let busData = [
            {
                route: "501",
                destination: "Downtown Terminal",
                currentSpeed: 45,
                distanceKm: 1.2,
                gpsLat: 40.7128,
                gpsLng: -74.0060,
                status: "On Time",
                capacity: "Medium",
                lastUpdate: new Date()
            },
            {
                route: "234B",
                destination: "Airport Express",
                currentSpeed: 38,
                distanceKm: 2.8,
                gpsLat: 40.7589,
                gpsLng: -73.9851,
                status: "On Time",
                capacity: "High",
                lastUpdate: new Date()
            },
            {
                route: "501",
                destination: "University Campus",
                currentSpeed: 42,
                distanceKm: 4.5,
                gpsLat: 40.6892,
                gpsLng: -74.0445,
                status: "Delayed",
                capacity: "Low",
                lastUpdate: new Date()
            },
            {
                route: "88",
                destination: "Shopping District",
                currentSpeed: 35,
                distanceKm: 0.8,
                gpsLat: 40.7505,
                gpsLng: -73.9934,
                status: "On Time",
                capacity: "Medium",
                lastUpdate: new Date()
            },
            {
                route: "156",
                destination: "Medical Center",
                currentSpeed: 40,
                distanceKm: 3.2,
                gpsLat: 40.7282,
                gpsLng: -73.7949,
                status: "Early",
                capacity: "Low",
                lastUpdate: new Date()
            },
            {
                route: "234B",
                destination: "Airport Express",
                currentSpeed: 44,
                distanceKm: 6.1,
                gpsLat: 40.6413,
                gpsLng: -73.7781,
                status: "On Time",
                capacity: "Medium",
                lastUpdate: new Date()
            }
        ];

        // Calculate arrival time based on distance and current speed
        function calculateArrivalTime(distanceKm, speedKmh) {
            if (speedKmh === 0) return "Stopped";
            const timeHours = distanceKm / speedKmh;
            const timeMinutes = Math.round(timeHours * 60);
            return timeMinutes;
        }

        // Get status color and icon
        function getStatusDisplay(status, arrivalMinutes) {
            const statusConfig = {
                "On Time": { color: "text-green-400", icon: "✓", bg: "" },
                "Delayed": { color: "text-red-400", icon: "⚠", bg: "urgent-arrival" },
                "Early": { color: "text-blue-400", icon: "⚡", bg: "" },
                "Stopped": { color: "text-yellow-400", icon: "⏸", bg: "" }
            };
            
            if (arrivalMinutes <= 1) {
                return { color: "text-yellow-300", icon: "🚌", bg: "urgent-arrival" };
            }
            
            return statusConfig[status] || statusConfig["On Time"];
        }

        // Format arrival time display
        function formatArrivalTime(minutes) {
            if (minutes === "Stopped") return "Stopped";
            if (minutes <= 0) return "Arriving";
            if (minutes === 1) return "1 min";
            return `${minutes} min`;
        }

        // Get capacity indicator
        function getCapacityIcon(capacity) {
            const icons = {
                "Low": "🟢",
                "Medium": "🟡", 
                "High": "🔴"
            };
            return icons[capacity] || "⚪";
        }

        // Render arrivals board
        function renderArrivals() {
            const container = document.getElementById('arrivalsContainer');
            
            // Calculate arrival times and sort
            const processedBuses = busData.map(bus => ({
                ...bus,
                arrivalMinutes: calculateArrivalTime(bus.distanceKm, bus.currentSpeed)
            })).sort((a, b) => {
                if (a.arrivalMinutes === "Stopped") return 1;
                if (b.arrivalMinutes === "Stopped") return -1;
                return a.arrivalMinutes - b.arrivalMinutes;
            });

            container.innerHTML = processedBuses.map((bus, index) => {
                const statusDisplay = getStatusDisplay(bus.status, bus.arrivalMinutes);
                const arrivalText = formatArrivalTime(bus.arrivalMinutes);
                const capacityIcon = getCapacityIcon(bus.capacity);
                
                return `
                    <div class="arrival-row px-6 py-4 grid grid-cols-12 gap-4 items-center hover:bg-gray-800/50 transition-colors ${statusDisplay.bg}" style="animation-delay: ${index * 0.1}s">
                        <div class="col-span-2">
                            <div class="text-2xl font-bold text-yellow-400">${bus.route}</div>
                        </div>
                        <div class="col-span-3">
                            <div class="font-semibold">${bus.destination}</div>
                            <div class="text-xs text-gray-400 mt-1">GPS: ${bus.gpsLat.toFixed(4)}, ${bus.gpsLng.toFixed(4)}</div>
                        </div>
                        <div class="col-span-2">
                            <div class="text-xl font-bold ${bus.arrivalMinutes <= 2 ? 'text-yellow-300' : 'text-white'}">${arrivalText}</div>
                        </div>
                        <div class="col-span-2">
                            <div class="font-semibold">${bus.distanceKm.toFixed(1)} km</div>
                        </div>
                        <div class="col-span-2">
                            <div class="flex items-center space-x-2">
                                <div class="speed-indicator w-2 h-2 rounded-full"></div>
                                <span class="font-mono">${bus.currentSpeed} km/h</span>
                            </div>
                        </div>
                        <div class="col-span-1 text-center">
                            <div class="flex items-center justify-center space-x-1">
                                <span class="${statusDisplay.color}">${statusDisplay.icon}</span>
                                <span class="text-xs">${capacityIcon}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Simulate real-time GPS and speed updates
        function updateBusData() {
            busData.forEach(bus => {
                // Simulate GPS movement (buses getting closer)
                if (bus.currentSpeed > 0) {
                    const movementKm = (bus.currentSpeed / 60) * 0.5; // Movement in 30 seconds
                    bus.distanceKm = Math.max(0, bus.distanceKm - movementKm);
                    
                    // Update GPS coordinates (simplified simulation)
                    bus.gpsLat += (Math.random() - 0.5) * 0.001;
                    bus.gpsLng += (Math.random() - 0.5) * 0.001;
                }
                
                // Simulate speed variations
                const speedVariation = (Math.random() - 0.5) * 10;
                bus.currentSpeed = Math.max(0, Math.min(60, bus.currentSpeed + speedVariation));
                
                // Reset bus if it arrives (distance becomes 0)
                if (bus.distanceKm <= 0.1) {
                    bus.distanceKm = Math.random() * 8 + 2; // Reset to 2-10 km away
                    bus.currentSpeed = Math.random() * 20 + 30; // Reset speed 30-50 km/h
                }
                
                bus.lastUpdate = new Date();
            });
            
            renderArrivals();
            updateLastUpdateTime();
        }

        // Update current time
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString();
        }

        // Update last update timestamp
        function updateLastUpdateTime() {
            document.getElementById('lastUpdate').textContent = 'Just now';
        }

        // Show service alerts
        function showAlert(message, type = 'info') {
            const alertsContainer = document.getElementById('alertsContainer');
            const colors = {
                info: 'bg-blue-600',
                warning: 'bg-orange-600',
                error: 'bg-red-600'
            };
            
            const alertEl = document.createElement('div');
            alertEl.className = `${colors[type]} text-white px-6 py-4 rounded-xl mb-2 opacity-0 transition-opacity duration-300`;
            alertEl.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="text-2xl">${type === 'warning' ? '⚠️' : type === 'error' ? '🚨' : 'ℹ️'}</div>
                    <div class="flex-1">${message}</div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-white/80 hover:text-white">✕</button>
                </div>
            `;
            
            alertsContainer.appendChild(alertEl);
            setTimeout(() => alertEl.classList.remove('opacity-0'), 100);
        }

        // Initialize
        setInterval(updateTime, 1000);
        setInterval(updateBusData, 30000); // Update every 30 seconds
        updateTime();
        renderArrivals();

        // Simulate occasional service alerts
        setTimeout(() => {
            showAlert('Route 234B: Minor delays due to traffic congestion on Highway 101', 'warning');
        }, 10000);

        setTimeout(() => {
            showAlert('Weather Alert: Light rain expected. Buses may experience slight delays.', 'info');
        }, 25000);
    </script>

</html>
